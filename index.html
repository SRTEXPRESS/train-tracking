<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>SRT Smart Train Tracking</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{margin:0}
#map{height:100vh}

.infoBox{
position:absolute;
top:15px;
left:15px;
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,0.3);
font-family:Arial;
z-index:1000;
width:270px;
}

.title{
font-weight:bold;
margin-bottom:8px;
font-size:18px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="infoBox">

<div class="title">🚆 Train Dashboard</div>

<div id="speed">Speed : -</div>
<div id="latlon">Lat/Lon : -</div>
<div id="bearing">Direction : -</div>
<div id="distance">Distance : -</div>

<hr>

<div>Field1 Lat : <span id="f1">-</span></div>
<div>Field2 Lon : <span id="f2">-</span></div>
<div>Field3 Speed : <span id="f3">-</span></div>
<div>Field4 Direction : <span id="f4">-</span></div>
<div>Field5 AccelX : <span id="f5">-</span></div>
<div>Field6 AccelY : <span id="f6">-</span></div>
<div>Field7 AccelZ : <span id="f7">-</span></div>
<div>Field8 Status : <span id="f8">-</span></div>

<hr>

<div id="time">Last Update : -</div>

</div>

<script>

// ===== CONFIG ใหม่ =====
const channelID = 3290459
const readAPI = "F2K7QK3HPA5F5Z7J"
const writeAPI = "33W4XMVDBIUVBVO0"

var map = L.map('map').setView([13.7367,100.5231],12)

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map)
// ===== Station Icon =====
var stationIcon = L.icon({
iconUrl: "https://cdn-icons-png.flaticon.com/512/684/684908.png",
iconSize: [30,30],
iconAnchor: [15,30],
popupAnchor: [0,-30]
})

// ===== สถานีรถไฟสามเสน =====
var samsen = L.marker([13.7794891,100.5299030],{icon:stationIcon})
.addTo(map)
.bindPopup("<b>สถานีรถไฟสามเสน</b><br>พิกัด: 13.7794891,100.5299030")

// ===== สถานีรถไฟบางซื่อ =====
var bangsue = L.marker([13.8040482,100.5400511],{icon:stationIcon})
.addTo(map)
.bindPopup("<b>สถานีรถไฟบางซื่อ</b><br>พิกัด: 13.8040482,100.5400511")
// ===== ไอคอนสามเหลี่ยมชี้ทิศ =====
var trainIcon = L.divIcon({
html:`
<svg id="trainSVG" width="40" height="40" viewBox="0 0 100 100">
<polygon points="50,10 90,90 50,75 10,90" fill="red"/>
</svg>
`,
className:'',
iconSize:[40,40],
iconAnchor:[20,20]
})

var marker
var polyline = L.polyline([],{color:'red'}).addTo(map)

// ===== Distance =====
function getDistance(lat1,lon1,lat2,lon2){
const R=6371
const dLat=(lat2-lat1)*Math.PI/180
const dLon=(lon2-lon1)*Math.PI/180
const a=Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2
const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))
return R*c
}

// ===== Bearing =====
function getBearing(lat1,lon1,lat2,lon2){
let dLon=(lon2-lon1)*Math.PI/180
lat1*=Math.PI/180
lat2*=Math.PI/180
let y=Math.sin(dLon)*Math.cos(lat2)
let x=Math.cos(lat1)*Math.sin(lat2)-
Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon)
let brng=Math.atan2(y,x)
brng=brng*180/Math.PI
return (brng+360)%360
}

async function loadGPS(){

const url=`https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${readAPI}&results=2`

const response=await fetch(url)
const data=await response.json()

if(!data.feeds||data.feeds.length<2)return

let f1=data.feeds[data.feeds.length-1]
let f0=data.feeds[data.feeds.length-2]

let lat1=parseFloat(f1.field1)
let lon1=parseFloat(f1.field2)
let lat0=parseFloat(f0.field1)
let lon0=parseFloat(f0.field2)

if(isNaN(lat1)||isNaN(lon1)||isNaN(lat0)||isNaN(lon0))return

let distance=getDistance(lat0,lon0,lat1,lon1)

let t1=new Date(f1.created_at)
let t0=new Date(f0.created_at)

let timeDiff=(t1-t0)/(1000*60*60)
let speed=0
if(timeDiff>0){
speed=distance/timeDiff
}

let bearing=getBearing(lat0,lon0,lat1,lon1)

if(!marker){
marker=L.marker([lat1,lon1],{icon:trainIcon}).addTo(map)
}else{
marker.setLatLng([lat1,lon1])
}

map.setView([lat1,lon1],15)

let svg=document.getElementById("trainSVG")
if(svg){
svg.style.transform=`rotate(${bearing}deg)`
}

polyline.addLatLng([lat1,lon1])

document.getElementById("speed").innerHTML="Speed : "+speed.toFixed(2)+" km/h"
document.getElementById("latlon").innerHTML="Lat/Lon : "+lat1.toFixed(5)+","+lon1.toFixed(5)
document.getElementById("bearing").innerHTML="Direction : "+bearing.toFixed(1)+"°"
document.getElementById("distance").innerHTML="Distance : "+distance.toFixed(3)+" km"

document.getElementById("f1").innerHTML=f1.field1
document.getElementById("f2").innerHTML=f1.field2
document.getElementById("f3").innerHTML=f1.field3
document.getElementById("f4").innerHTML=f1.field4
document.getElementById("f5").innerHTML=f1.field5
document.getElementById("f6").innerHTML=f1.field6
document.getElementById("f7").innerHTML=f1.field7
document.getElementById("f8").innerHTML=f1.field8

document.getElementById("time").innerHTML="Last Update : "+t1.toLocaleString()
}

loadGPS()
setInterval(loadGPS,15000)

</script>

</body>
</html>
